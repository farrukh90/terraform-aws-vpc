name: Terraform (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment name (dev, qa, prod)"
        required: true
        type: string
      apply:
        description: "Run terraform apply after plan"
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: true
      TF_STATE_BUCKET:
        required: true
      TF_LOCK_TABLE:
        required: true

jobs:
  terraform:
    name: "Terraform ${{ inputs.apply && 'Plan + Apply' || 'Plan' }} — ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    environment: ${{ (inputs.apply && inputs.environment == 'prod') && 'production' || '' }}

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: examples

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.1"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=terraform/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true" \
            -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="accounts/aws/us-east-1/${{ inputs.environment }}/terraform.auto.tfvars" \
            -out=tfplan \
            -input=false

      - name: Terraform Apply
        if: inputs.apply
        run: terraform apply -input=false tfplan
